<!doctype html>
<html lang="{{ page.lang | default: site.lang }}" dir="{% if page.lang == 'fa' %}rtl{% else %}ltr{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}{% if page.title and page.url != "/" %} · {{ page.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | strip_html | strip_newlines | truncate: 160 | default: site.description }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/assets/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body{% if page.full %} class="home"{% endif %}>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.name }}</a>
      <nav>
        {% assign path = page.url %}
        <a href="{{ '/about/' | relative_url }}" {% if path contains '/about' %}class="active"{% endif %}>About</a>
        <div class="nav-drop">
          <a href="{{ '/projects/' | relative_url }}" aria-haspopup="true" {% if path contains '/projects' %}class="active"{% endif %}>Projects</a>
          <div class="drop-menu">
            <div class="drop-inner">
              <a href="{{ '/projects/asoo-design/' | relative_url }}">Jewelry making</a>
              <div class="sub-drop">
                <a class="sub-toggle" href="{{ '/projects/' | relative_url }}#retail" aria-haspopup="true" aria-expanded="false">Retail projects <span class="chev" aria-hidden="true">›</span></a>
                <div class="sub-menu">
                  <a href="{{ '/projects/visual-merchandising/' | relative_url }}">Visual merchandising</a>
                  <a href="{{ '/projects/weekly-insights-report/' | relative_url }}">Weekly insights report</a>
                </div>
              </div>
            </div>
          </div>
        </div>
        <a href="{{ '/resume/' | relative_url }}" {% if path contains '/resume' %}class="active"{% endif %}>Resume</a>
        <a href="{{ '/journal/' | relative_url }}" {% if path contains '/journal' %}class="active"{% endif %}>Journal</a>
      </nav>
    </div>
  </header>

  <main class="{% if page.full %}full{% else %}wrap{% if page.wide %} wide{% endif %}{% endif %}">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>© {{ site.time | date: '%Y' }} {{ site.name }}</span>
      <span class="links">
        <a href="mailto:{{ site.email }}">Email</a>
        <a href="{{ site.linkedin }}">LinkedIn</a>
      </span>
    </div>
  </footer>
  <script>
    // Projects menu. Mouse: hover opens. Touch or pen: tap opens/closes (never jumps to a page).
    // "Retail projects" has its own list that opens only when you hover or tap it.
    (function () {
      var drop = document.querySelector('.nav-drop'), t = document.querySelector('.nav-drop > a'),
          menu = document.querySelector('.drop-inner'), sub = document.querySelector('.sub-drop'),
          st = document.querySelector('.sub-toggle');
      if (!drop || !t || !menu) return;
      var pointer = 'mouse', timer = null;
      document.addEventListener('pointerdown', function (e) { pointer = e.pointerType || 'mouse'; }, true);

      function place() { menu.style.setProperty('--drop-indent', t.getBoundingClientRect().left + 'px'); }
      function setDrop(on) {
        drop.classList.toggle('open', on); t.setAttribute('aria-expanded', on);
        if (!on) setSub(false); else place();
      }
      function setSub(on) { if (sub) { sub.classList.toggle('open', on); st.setAttribute('aria-expanded', on); } }
      place(); window.addEventListener('resize', place);

      drop.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') { clearTimeout(timer); setDrop(true); } });
      drop.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') { timer = setTimeout(function () { setDrop(false); }, 150); } });
      t.addEventListener('click', function (e) {
        if (pointer === 'mouse') return;          // mouse click: go to the Projects page
        e.preventDefault(); setDrop(!drop.classList.contains('open'));
      });

      if (sub && st) {
        sub.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') setSub(true); });
        sub.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') setSub(false); });
        st.addEventListener('click', function (e) {
          if (pointer === 'mouse') return;        // mouse click: go to the retail projects
          e.preventDefault(); setSub(!sub.classList.contains('open'));
        });
      }
      document.addEventListener('click', function (e) { if (!drop.contains(e.target)) setDrop(false); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setDrop(false); });
    })();
  </script>
</body>
</html>
